[pytest]
# Daily Briefing Agent - Pytest Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Fast isolated tests with mocked dependencies
    integration: LocalStack-based AWS service testing
    property: Hypothesis-based property testing
    browser: Playwright-based UI testing
    slow: Tests that take longer to run

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Coverage configuration
# Run with: pytest --cov=src --cov-report=html
# Minimum coverage is 70% as per project requirements

# Async mode for pytest-asyncio
asyncio_mode = auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
