[pytest]
# Pytest configuration for Chapter 10 multi-agent swarm tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = starter/tests

# Async support
asyncio_mode = auto

# Markers
markers =
    integration: Integration tests requiring Redis
    slow: Slow running tests
    unit: Fast unit tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
addopts =
    --verbose
    --strict-markers
    --tb=short
    -ra

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
