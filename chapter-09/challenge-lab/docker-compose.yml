services:
  # ChromaDB: same vector store as the hands-on lab.
  # Stop the hands-on-lab container first; both bind host port 8000.
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: teammemory-chromadb
    # 127.0.0.1 keeps this service off your network. If WSL cannot reach it
    # through Docker Desktop, see Troubleshooting in the README.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Chroma 1.x persists to /data inside the container (named volume;
      # `docker compose down -v` removes it).
      - chroma-data:/data
    healthcheck:
      # No curl or wget in this image, so probe over a bash TCP redirection.
      # Chroma 1.x serves /api/v2/...; /api/v1/... returns HTTP 410 Gone.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q 200'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teammemory-network

  # Neo4j: graph store for organizational memory (Chapter 9, Section 9.7)
  neo4j:
    image: neo4j:5-community
    container_name: teammemory-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # Browser UI
      - "127.0.0.1:7687:7687"   # Bolt driver
    environment:
      - NEO4J_AUTH=neo4j/devmemory
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "devmemory", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - teammemory-network

networks:
  teammemory-network:
    driver: bridge

volumes:
  chroma-data:
  neo4j-data:
