[pytest]
# Run pytest from hands-on-lab/ so these relative paths resolve.
testpaths = starter/tests

# Put starter/ itself on the import path, so the tests import modules the
# same flat way the book's listings do: from memory_core import DevMemory.
pythonpath = starter

# -v names each test as it runs; --tb=short keeps integration failures
# (container down, API key missing) readable.
addopts = -v --tb=short
